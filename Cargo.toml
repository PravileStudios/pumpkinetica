[package]
name = "pumpkinetica"
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Indrajeeth"]
repository = "https://github.com/PravileStudios/pumpkinetica"

[workspace]
# The IPC example is a standalone crate built separately; keep it out of the
# main plugin build.
exclude = ["examples/ipc-tester"]

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "c7d4c08d9d740b79cad7a435849832022a3bf4a6" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
