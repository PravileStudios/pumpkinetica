[package]
name = "pumpkinetica"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Indrajeeth"]
repository = "https://github.com/IndrajeethY/pschematics"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { path = "../Pumpkin/pumpkin-plugin-api" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.component]
target = { path = "../Pumpkin/pumpkin-plugin-wit" }
